<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Engine workflow demo</title><style>body{font:16px system-ui;background:#111827;color:#edf2ff;max-width:720px;margin:40px auto;padding:20px}label{display:block;margin:12px 0}input,button,select{font:inherit;padding:9px}article{background:#233047;border-radius:10px;padding:16px;margin:10px 0}</style><h1>Content Engine — simulated publishing queue</h1><p>Independent fictional workflow. No social accounts, network calls or actual publishing.</p><form id="f"><label>Post title <input id="title" maxlength="100" required></label><label>Platform <select id="platform"><option>Facebook</option><option>LinkedIn</option><option>YouTube</option></select></label><label>Scheduled local time <input id="when" type="datetime-local" required></label><label><input id="approved" type="checkbox"> Human approval recorded (simulation)</label><button>Add draft</button></form><div id="queue" aria-live="polite"></div><script>const q=document.querySelector('#queue');document.querySelector('#f').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#title').value.trim(),when=new Date(document.querySelector('#when').value),ok=document.querySelector('#approved').checked;if(!title||!Number.isFinite(when.getTime()))return;const card=document.createElement('article'),state=!ok?'Awaiting review':when.getTime()>Date.now()?'Scheduled':'Eligible for simulated queue';card.textContent=title+' | '+document.querySelector('#platform').value+' | '+when.toLocaleString()+' | '+state;q.prepend(card)};</script><p>Queue eligibility is not proof of successful publication.</p></html>
